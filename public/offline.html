<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Actiproc is temporarily unavailable</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: #f8fafc; color: #0f172a; }
      main { min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
      section { width: min(100%, 440px); border: 1px solid #dbe3ee; border-radius: 24px; background: #fff; padding: 28px; box-shadow: 0 22px 60px rgb(15 23 42 / .12); }
      .brand { display: flex; align-items: center; gap: 12px; color: #2563eb; font-weight: 750; letter-spacing: -.02em; }
      .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 15px; background: #dbeafe; font-size: 24px; }
      h1 { margin: 28px 0 10px; font-size: clamp(28px, 8vw, 38px); line-height: 1.08; letter-spacing: -.04em; }
      p { margin: 0; color: #64748b; font-size: 16px; line-height: 1.55; }
      .status { min-height: 22px; margin-top: 18px; font-size: 14px; color: #64748b; }
      button { width: 100%; min-height: 50px; margin-top: 18px; border: 0; border-radius: 14px; background: #3b82f6; color: #07111f; font: inherit; font-weight: 750; cursor: pointer; }
      button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: .65; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f8fafc; }
        section { border-color: #2a3a51; background: #162235; box-shadow: 0 22px 60px rgb(0 0 0 / .35); }
        .mark { background: #1e3a5f; }
        p, .status { color: #a8b5c7; }
        button { background: #60a5fa; }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="offline-title">
        <div class="brand"><span class="mark" aria-hidden="true">✦</span><span>Actiproc</span></div>
        <h1 id="offline-title">We can’t reach Actiproc</h1>
        <p>Your connection or Actiproc may be temporarily unavailable. Your account and saved work are unchanged.</p>
        <div id="status" class="status" role="status" aria-live="polite">Reconnect, then try again.</div>
        <button id="retry" type="button">Try again</button>
      </section>
    </main>
    <script>
      const retry = document.getElementById('retry');
      const status = document.getElementById('status');

      async function retryConnection() {
        retry.disabled = true;
        status.textContent = 'Checking the connection…';
        try {
          const response = await fetch('/manifest.webmanifest?connectivity=' + Date.now(), {
            cache: 'no-store',
            credentials: 'same-origin',
          });
          if (!response.ok) throw new Error('unavailable');
          status.textContent = 'Connection restored. Loading Actiproc…';
          window.location.reload();
        } catch {
          status.textContent = 'Actiproc is still unreachable. Check your connection and try again.';
          retry.disabled = false;
        }
      }

      retry.addEventListener('click', retryConnection);
      window.addEventListener('online', () => {
        status.textContent = 'A connection is available. Try again when you’re ready.';
      });
      window.addEventListener('offline', () => {
        status.textContent = 'Your device appears to be offline.';
      });
    </script>
  </body>
</html>
