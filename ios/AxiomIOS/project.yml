name: Axiom
options:
  bundleIdPrefix: com.axiomproductivity
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Axiom:
    type: application
    platform: iOS
    sources:
      - path: Axiom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axiomproductivity.ios
        CODE_SIGN_ENTITLEMENTS: Axiom/Axiom.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    info:
      path: Axiom/Info.plist
      properties:
        CFBundleDisplayName: Axiom
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Attach photos and documents to your Axiom work.
        NSPhotoLibraryUsageDescription: Select images to attach to your Axiom work.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
    entitlements:
      path: Axiom/Axiom.entitlements
schemes:
  Axiom:
    build:
      targets:
        Axiom: all
    run:
      config: Debug
    archive:
      config: Release
