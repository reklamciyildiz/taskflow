name: Secure PDF attachments quality

on:
  pull_request:
    paths:
      - 'lib/attachments.ts'
      - 'lib/attachment-server.ts'
      - 'app/api/attachments/**'
      - 'components/attachments/**'
      - 'components/editor/BlockEditor.tsx'
      - 'scripts/test-attachments.ts'
      - 'scripts/test-attachments-browser.cjs'
      - 'scripts/test-attachments-db.cjs'
      - 'scripts/fixtures/attachments.tsx'
      - '.github/workflows/attachments-quality.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'lib/attachments.ts'
      - 'lib/attachment-server.ts'
      - 'app/api/attachments/**'
      - 'components/attachments/**'
      - 'components/editor/BlockEditor.tsx'
      - 'scripts/test-attachments.ts'
      - 'scripts/test-attachments-browser.cjs'
      - 'scripts/test-attachments-db.cjs'
      - 'scripts/fixtures/attachments.tsx'
      - '.github/workflows/attachments-quality.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attachment-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: PDF access, scanning, checksum, ACL and private object storage tests
        run: npx tsx scripts/test-attachments.ts
      - name: Install isolated PostgreSQL harness (not production)
        run: npm install --no-save --package-lock=false @electric-sql/pglite
      - name: Attachment metadata constraints, RLS, quota and cleanup tests
        run: node scripts/test-attachments-db.cjs node_modules/@electric-sql/pglite
      - name: Next TypeScript compile
        run: npx tsc --noEmit

  attachment-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Action, Note, Checklist and scanned/legacy PDF UI regressions
        run: node scripts/test-attachments-browser.cjs node_modules/playwright-core "$(node -p "require('playwright').chromium.executablePath()")"
