name: Actiproc AI Turkish and Process content quality
on:
  pull_request:
    paths:
      - 'lib/ai/agent/**'
      - 'lib/ai/chat/**'
      - 'app/api/ai/chat/route.ts'
      - 'scripts/test-ai-tr-process-context.ts'
      - '.github/workflows/ai-turkish-process-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  language-and-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Turkish and English context regressions
        run: npx tsx scripts/test-ai-tr-process-context.ts
      - name: Existing AI read tools regressions
        run: npx tsx scripts/test-ai-read-tools.ts
      - name: Existing AI intent, citation and chat regressions
        run: npx tsx scripts/test-ai-chat.ts
      - name: Existing AI entity matching regressions
        run: npm run test:ai:typo
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Next.js build (inert CI configuration)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          NEXTAUTH_SECRET: ci-non-production-build-placeholder-only
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_placeholder_never_valid
          RESEND_FROM_EMAIL: ci@example.invalid
        run: npm run build
