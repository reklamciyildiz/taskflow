name: Premium landing page quality

on:
  pull_request:
    paths:
      - 'app/(marketing)/**'
      - 'components/marketing/**'
      - 'scripts/test-marketing-premium.ts'
      - 'scripts/test-marketing-browser.cjs'
      - '.github/workflows/marketing-premium-quality.yml'
  push:
    branches: [main]
    paths:
      - 'app/(marketing)/**'
      - 'components/marketing/**'
      - 'scripts/test-marketing-premium.ts'
      - 'scripts/test-marketing-browser.cjs'
      - '.github/workflows/marketing-premium-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketing-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Marketing source and product truth
        run: npx tsx scripts/test-marketing-premium.ts
      - name: AI plan/allowance fidelity
        run: npm run test:ai:commercial-ui
      - name: Creem billing and paid plan regression
        run: npm run test:creem
      - name: Web TypeScript
        run: npx tsc --noEmit
      - name: Install isolated Chromium for responsive QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Run Next marketing route locally and exercise it in Chromium
        run: |
          (npm run dev -- -p 3217 > /tmp/actiproc-marketing-next.log 2>&1 & echo $! > /tmp/actiproc-marketing-next.pid)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3217/marketing -o /dev/null; then break; fi
            if [ "$i" = 90 ]; then cat /tmp/actiproc-marketing-next.log; exit 1; fi
            sleep 2
          done
          node scripts/test-marketing-browser.cjs
      - name: Upload failure screenshots and Next diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-responsive-diagnostics
          path: |
            marketing-browser-artifacts/
            /tmp/actiproc-marketing-next.log
          if-no-files-found: ignore
