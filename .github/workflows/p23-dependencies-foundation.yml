name: P2.3.1 Smart Dependencies foundation

on:
  pull_request:
    paths:
      - '.github/workflows/p23-dependencies-foundation.yml'
      - 'supabase/migrations/20261115220000_task_dependencies_foundation.sql'
      - 'app/api/tasks/**'
      - 'app/api/projects/[id]/route.ts'
      - 'app/api/inbox/board/route.ts'
      - 'app/api/schedules/route.ts'
      - 'lib/task-dependencies.ts'
      - 'lib/api.ts'
      - 'scripts/test-task-dependencies*'
      - 'docs/P23_SMART_DEPENDENCIES_FOUNDATION.md'
      - 'components/ActionPanel.tsx'
      - 'components/TaskBoard.tsx'
      - 'components/TaskCard.tsx'
      - 'components/TaskList.tsx'
      - 'components/PropertyBoard.tsx'
      - 'components/action/ActionDependencies.tsx'
      - 'components/action/DependencyStatusBadge.tsx'
      - 'hooks/useTeamDependencySummary.ts'
      - 'lib/task-dependency-ui.ts'
      - 'lib/i18n/catalog.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Domain and security contracts
        run: npx tsx scripts/test-task-dependencies.ts
      - name: Real API route — ACL, private Process redaction and idempotency
        run: node scripts/test-task-dependencies-api.cjs
      - name: P2.3.2 dependency UI and bilingual behavior
        run: npx tsx scripts/test-task-dependencies-ui.ts
      - name: P2.3.2 actual team summary API / access control
        run: node scripts/test-task-dependency-summary-api.cjs
      - name: PostgreSQL schema, lifecycle and authorization integrity
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          bash scripts/test-task-dependencies-sql.sh
      - name: Concurrent cycle and completion race tests (two PostgreSQL clients)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node scripts/test-task-dependencies-concurrency.cjs
      - name: Existing Board lifecycle regressions
        run: npm run test:board:premium
      - name: Existing scheduling regressions
        run: npm run test:scheduling
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build (inert CI credentials)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          NEXTAUTH_SECRET: ci-only-build-secret
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_placeholder_never_valid
          RESEND_FROM_EMAIL: ci@example.invalid
        run: npm run build
