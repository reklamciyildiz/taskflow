name: Premium AI workspace quality

on:
  pull_request:
    paths:
      - 'components/ai/**'
      - 'lib/ai/chat/response-markdown.ts'
      - 'lib/ai/chat/prompt.ts'
      - 'scripts/test-ai-response-markdown.ts'
      - 'scripts/test-ai-premium-browser.cjs'
      - 'scripts/fixtures/ai-premium.tsx'
      - '.github/workflows/ai-premium-workspace.yml'
  push:
    branches: [main]
    paths:
      - 'components/ai/**'
      - 'scripts/test-ai-premium-browser.cjs'
      - 'scripts/fixtures/ai-premium.tsx'
      - '.github/workflows/ai-premium-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-ai-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript compatibility
        run: npx tsc --noEmit
      - name: Rich AI response safety, tables and Markdown contracts
        run: npm run test:ai:markdown
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Real responsive AI conversation regressions
        run: node scripts/test-ai-premium-browser.cjs node_modules/playwright-core "$(node -p "require('playwright').chromium.executablePath()")"
