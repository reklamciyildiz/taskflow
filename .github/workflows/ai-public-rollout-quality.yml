name: AI public access and pricing safety
on:
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'app/api/ai/**'
      - 'components/ai/**'
      - 'components/billing/**'
      - 'components/marketing/sections/MarketingPricing.tsx'
      - 'scripts/test-ai-plan-ux.ts'
      - 'scripts/test-ai-public-access.ts'
      - 'scripts/test-ai-entity-matching.ts'
      - 'scripts/test-ai-public-rate-sql.sh'
      - 'supabase/migrations/*ai*.sql'
      - 'package.json'
      - '.github/workflows/ai-public-rollout-quality.yml'
  push:
    branches: [main]
    paths:
      - 'lib/ai/**'
      - 'app/api/ai/**'
      - 'components/ai/**'
      - 'components/billing/**'
      - 'components/marketing/sections/MarketingPricing.tsx'
      - 'scripts/test-ai-plan-ux.ts'
      - 'scripts/test-ai-public-access.ts'
      - 'scripts/test-ai-entity-matching.ts'
      - 'scripts/test-ai-public-rate-sql.sh'
      - 'supabase/migrations/*ai*.sql'
      - 'package.json'
  workflow_dispatch:
jobs:
  test-public-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ai:public
      - run: npm run test:ai:typo
      - run: npx tsx scripts/test-ai-write-tools.ts
      - run: npx tsx scripts/test-ai-read-tools.ts
      - run: npm run test:ai:commercial-ui
      - name: Test SQL minute admission and parallel safety
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          bash scripts/test-ai-public-rate-sql.sh
      - run: npx tsx scripts/test-ai-beta-access.ts
      - run: npx tsx scripts/test-ai-chat.ts
      - run: npm run test:mobile-web
      - run: npx tsc --noEmit
