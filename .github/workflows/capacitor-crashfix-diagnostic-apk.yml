name: Capacitor Android crashfix diagnostic APK

on:
  push:
    branches:
      - fix/capacitor-oauth-webview-thread-crash-20261031
    paths:
      - .github/workflows/capacitor-crashfix-diagnostic-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Actiproc diagnostic APK (debug only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Capacitor dependencies
        run: npm ci --prefix mobile

      - name: Test native OAuth and mobile navigation contracts
        run: |
          node scripts/test-capacitor-oauth-handoff.mjs
          node scripts/test-capacitor-mobile-shell.mjs

      - name: Prepare placeholder assets for remote-WebView diagnostic sync
        run: |
          mkdir -p mobile/dist
          printf '<!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>Diagnostic shell</body></html>\n' > mobile/dist/index.html
          chmod +x mobile/android/gradlew

      - name: Build debug diagnostic APK pointing at existing web product
        working-directory: mobile
        run: npm run android:debug:capacitor-poc

      - name: Check APK presence and native config
        run: |
          test -s dist/capacitor/Actiproc-Capacitor-Diagnostic-POC.apk
          unzip -tq dist/capacitor/Actiproc-Capacitor-Diagnostic-POC.apk
          unzip -p dist/capacitor/Actiproc-Capacitor-Diagnostic-POC.apk assets/capacitor.config.json | grep -F 'https://www.actiproc.com/'

      - uses: actions/upload-artifact@v4
        with:
          name: Actiproc-Capacitor-Crashfix-Diagnostic-APK
          path: dist/capacitor/Actiproc-Capacitor-Diagnostic-POC.apk
          if-no-files-found: error
          retention-days: 7
