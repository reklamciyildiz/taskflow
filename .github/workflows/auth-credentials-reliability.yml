name: Credentials sign-in reliability
on:
  pull_request:
    paths:
      - 'lib/auth.ts'
      - 'lib/password-login.ts'
      - 'app/auth/signin/SignInClient.tsx'
      - 'scripts/test-password-login.ts'
      - '.github/workflows/auth-credentials-reliability.yml'
  push:
    branches: ['fix/auth-credentials-reliability-20261116']
    paths:
      - 'lib/auth.ts'
      - 'lib/password-login.ts'
      - 'app/auth/signin/SignInClient.tsx'
      - 'scripts/test-password-login.ts'
      - '.github/workflows/auth-credentials-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Credential authentication behavior and security
        run: npx tsx scripts/test-password-login.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Next production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          NEXTAUTH_SECRET: ci-only-build-secret
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_placeholder_never_valid
          RESEND_FROM_EMAIL: ci@example.invalid
        run: npm run build
