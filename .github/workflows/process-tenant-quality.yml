name: Process and organization directory access
on:
  pull_request:
    paths:
      - 'app/api/projects/**'
      - 'app/api/organizations/**'
      - 'scripts/test-process-tenant-access.ts'
      - '.github/workflows/process-tenant-quality.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/projects/**'
      - 'app/api/organizations/**'
      - 'scripts/test-process-tenant-access.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-tenant:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/test-process-tenant-access.ts
      - run: npx tsc --noEmit
      - run: npm run test:board:premium
      - run: npm run test:creem
