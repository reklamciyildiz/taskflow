name: iOS Simulator Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-launch:
    name: Build and launch Axiom
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_PROJECT_DIR: ios/AxiomIOS
      CI_OUTPUT: ${{ github.workspace }}/.ci
      DERIVED_DATA: ${{ github.workspace }}/.ci/AxiomDerivedData
      BUILD_LOG: ${{ github.workspace }}/.ci/axiom-xcodebuild.log
      RESULT_BUNDLE: ${{ github.workspace }}/.ci/AxiomBuild.xcresult
      SCREENSHOT_DIR: ${{ github.workspace }}/.ci/screenshots
      DEVICE_LIST: ${{ github.workspace }}/.ci/simulator-devices.txt
      APP_ARCHIVE: ${{ github.workspace }}/.ci/Axiom-Simulator.app.zip

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify runner and Xcode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CI_OUTPUT}"
          sw_vers
          xcodebuild -version | tee "${CI_OUTPUT}/xcode-version.txt"
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2,v,"."); print v[1]}')"
          if [ "${XCODE_MAJOR}" -lt 26 ]; then
            echo "Xcode 26 or newer is required; found $(xcodebuild -version | head -1)." >&2
            exit 1
          fi
          xcrun simctl list runtimes | tee "${CI_OUTPUT}/simulator-runtimes.txt"

      - name: Verify iOS security contracts
        run: npm run ios:check

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          xcodebuild -project Axiom.xcodeproj -list

      - name: Build unsigned Simulator app
        working-directory: ${{ env.IOS_PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project Axiom.xcodeproj -scheme Axiom -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "${DERIVED_DATA}" -resultBundlePath "${RESULT_BUNDLE}" CODE_SIGNING_ALLOWED=NO build | tee "${BUILD_LOG}"

          APP_PATH="${DERIVED_DATA}/Build/Products/Debug-iphonesimulator/Axiom.app"
          test -d "${APP_PATH}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "${APP_PATH}/Info.plist")" = "LaunchBackground"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIImageName' "${APP_PATH}/Info.plist")" = "LaunchLogo"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "${APP_PATH}/Info.plist" | grep -q '1'
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "${APP_PATH}/Info.plist" >/dev/null
          plutil -p "${APP_PATH}/Info.plist" > "${CI_OUTPUT}/compiled-info-plist.txt"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${APP_ARCHIVE}"

      - name: Launch Axiom across iPhone sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${SCREENSHOT_DIR}"
          : > "${DEVICE_LIST}"
          RUNTIME_ID="$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          values = [r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "SimRuntime.iOS" in r.get("identifier", "")]
          if not values:
              raise SystemExit("No available iOS Simulator runtime")
          print(sorted(values, key=lambda r: tuple(int(x) for x in r.get("version", "0").split(".")))[-1]["identifier"])
          ')"
          DEVICE_TYPE_LIST="${CI_OUTPUT}/simulator-device-types.txt"
          xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          values = [d for d in json.load(sys.stdin)["devicetypes"] if d.get("name", "").startswith("iPhone")]
          if not values:
              raise SystemExit("No iPhone Simulator device types are available")
          small = next((d for d in values if "SE" in d["name"]), values[0])
          standard = [d for d in values if "Pro" in d["name"] and "Max" not in d["name"]]
          large = [d for d in values if "Pro Max" in d["name"]]
          choices = [("standard", (standard or values)[-1]), ("large", (large or values)[-1]), ("small", small)]
          emitted = set()
          for label, device in choices:
              if device["identifier"] not in emitted:
                  emitted.add(device["identifier"])
                  print("{}|{}".format(label, device["identifier"]))
          ' > "${DEVICE_TYPE_LIST}"
          if [ "$(wc -l < "${DEVICE_TYPE_LIST}" | tr -d ' ')" -lt 2 ]; then
            echo "At least two distinct iPhone Simulator sizes are required." >&2
            exit 1
          fi

          SUCCESSFUL_DEVICES=0
          while IFS= read -r entry; do
            LABEL="${entry%%|*}"
            DEVICE_TYPE="${entry#*|}"
            if ! DEVICE_UDID="$(xcrun simctl create "Axiom CI iPhone ${LABEL}" "${DEVICE_TYPE}" "${RUNTIME_ID}")"; then
              echo "Skipping unsupported ${LABEL} device type ${DEVICE_TYPE}."
              continue
            fi
            echo "${DEVICE_UDID}|${LABEL}" >> "${DEVICE_LIST}"
            xcrun simctl boot "${DEVICE_UDID}"
            if ! python3 -c 'import subprocess, sys; subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=120)' "${DEVICE_UDID}"; then
              echo "Skipping ${LABEL}; Simulator did not finish booting within 120 seconds."
              xcrun simctl shutdown "${DEVICE_UDID}" || true
              xcrun simctl delete "${DEVICE_UDID}" || true
              continue
            fi
            xcrun simctl install "${DEVICE_UDID}" "${DERIVED_DATA}/Build/Products/Debug-iphonesimulator/Axiom.app"
            xcrun simctl launch "${DEVICE_UDID}" com.axiomproductivity.ios
            sleep 10
            xcrun simctl io "${DEVICE_UDID}" screenshot "${SCREENSHOT_DIR}/axiom-${LABEL}.png"
            sips -g pixelWidth -g pixelHeight "${SCREENSHOT_DIR}/axiom-${LABEL}.png" | tee "${CI_OUTPUT}/screenshot-${LABEL}-dimensions.txt"
            xcrun simctl spawn "${DEVICE_UDID}" log show --style compact --last 3m --predicate 'process == "Axiom"' > "${CI_OUTPUT}/axiom-simulator-${LABEL}.log" || true
            xcrun simctl shutdown "${DEVICE_UDID}"
            xcrun simctl delete "${DEVICE_UDID}"
            SUCCESSFUL_DEVICES=$((SUCCESSFUL_DEVICES + 1))
          done < "${DEVICE_TYPE_LIST}"
          if [ "${SUCCESSFUL_DEVICES}" -lt 2 ]; then
            echo "Axiom must launch successfully on at least two iPhone Simulator sizes." >&2
            exit 1
          fi

      - name: Collect Simulator logs
        if: always()
        shell: bash
        run: |
          if [ -f "${DEVICE_LIST}" ]; then
            while IFS='|' read -r DEVICE_UDID LABEL; do
              [ -n "${DEVICE_UDID}" ] || continue
              xcrun simctl shutdown "${DEVICE_UDID}" || true
              xcrun simctl delete "${DEVICE_UDID}" || true
            done < "${DEVICE_LIST}"
          fi

      - name: Upload Simulator build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-ios-simulator-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ github.workspace }}/.ci/Axiom-Simulator.app.zip
            ${{ github.workspace }}/.ci/AxiomBuild.xcresult
            ${{ github.workspace }}/.ci/axiom-xcodebuild.log
            ${{ github.workspace }}/.ci/screenshots/
            ${{ github.workspace }}/.ci/axiom-simulator-*.log
            ${{ github.workspace }}/.ci/screenshot-*-dimensions.txt
            ${{ github.workspace }}/.ci/simulator-device-types.txt
            ${{ github.workspace }}/.ci/compiled-info-plist.txt
            ${{ github.workspace }}/.ci/xcode-version.txt
            ${{ github.workspace }}/.ci/simulator-runtimes.txt
