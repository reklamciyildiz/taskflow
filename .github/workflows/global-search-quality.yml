name: Global Search and Command Palette Quality

on:
  pull_request:
    paths:
      - 'components/Header.tsx'
      - 'components/Customers.tsx'
      - 'components/search/**'
      - 'lib/search/**'
      - 'app/api/search/**'
      - 'scripts/test-global-search.ts'
      - '.github/workflows/global-search-quality.yml'
  push:
    branches: [main]
    paths:
      - 'components/search/**'
      - 'app/api/search/**'
      - 'scripts/test-global-search.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Search ACL, ranking, navigation and keyboard contracts
        run: npx tsx scripts/test-global-search.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: ci-not-a-real-service-role-key
          NEXTAUTH_SECRET: ci-only-build-secret
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_placeholder_never_valid
          RESEND_FROM_EMAIL: ci@example.invalid
        run: npm run build
