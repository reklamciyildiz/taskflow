name: Planner drag and checklist quality
on:
  pull_request:
    paths:
      - 'components/planner/**'
      - 'lib/planner-drag-reschedule.ts'
      - 'lib/planner-v2-utils.ts'
      - 'lib/tiptap-parser.ts'
      - 'scripts/test-planner-drag-capture.ts'
      - 'package.json'
      - '.github/workflows/planner-drag-quality.yml'
  push:
    branches: [main]
    paths:
      - 'components/planner/**'
      - 'lib/planner-drag-reschedule.ts'
      - 'scripts/test-planner-drag-capture.ts'
      - 'package.json'
  workflow_dispatch:
jobs:
  planner-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:planner:drag
      - run: npm run test:scheduling
      - run: npm run test:mobile-web
      - run: npx tsc --noEmit
