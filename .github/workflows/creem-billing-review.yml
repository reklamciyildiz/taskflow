name: Creem billing review checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'lib/creem-*'
      - 'lib/billing-plans.ts'
      - 'lib/upgrade-recommendations.ts'
      - 'app/api/projects/route.ts'
      - 'components/CreateProjectModal.tsx'
      - 'scripts/test-process-upgrade-options.ts'
      - 'scripts/test-plan-entitlement-matrix.ts'
      - 'lib/entitlements.ts'
      - 'app/api/billing/**'
      - 'app/api/webhooks/creem/**'
      - 'components/billing/**'
      - 'components/marketing/**'
      - 'supabase/migrations/20261101110000_creem_parallel_billing.sql'
      - 'supabase/migrations/20261107173000_creem_annual_product_intents.sql'
      - 'scripts/test-creem-billing-contract.ts'
      - 'scripts/verify-creem-live-products.ts'
      - 'scripts/test-creem-annual-catalog.ts'
      - 'scripts/audit-retired-billing-provider.mjs'
      - 'app/(shell)/integrations/**'
      - 'package.json'
      - '.github/workflows/creem-billing-review.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:creem
      - run: npx tsx scripts/test-creem-annual-catalog.ts
      - run: npx tsx scripts/test-process-upgrade-options.ts
      - run: npx tsx scripts/test-plan-entitlement-matrix.ts
      - name: Scan all project source for retired payment provider dependencies
        run: node scripts/audit-retired-billing-provider.mjs
      - run: npm run test:mobile-web
      - run: npm run test:capacitor-oauth
      - run: node scripts/test-capacitor-mobile-shell.mjs
      - run: npx tsc --noEmit
